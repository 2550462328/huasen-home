# TinyBlog Article Summary — Gold Standard Dataset
#
# Purpose: Human-labeled evaluation set for阿里百炼 AI summary generation.
#
# How to populate:
# 1. Select 10 representative TinyBlog articles (4 typical + 3 edge + 3 adversarial)
# 2. For each article, copy the full Markdown body to `input.body`
# 3. Write the "ideal summary" (70-110 chars) in `gold_output`
# 4. Document your reasoning in `notes`
# 5. Tag the failure mode this row guards against in `failure_mode_target`
#
# Failure modes:
# - lead_only_summary: AI只摘开头，主旨缺失
# - clickbait: 摘要夸大或暗示正文没兑现的内容
# - length_drift: 长度超出70-110字范围
# - marketing_fluff: 空泛营销话术，信息密度低
# - format_pollution: 带前缀/引号/Markdown残留
#
# Usage:
# - Manual review: Portal owner inspects AI output vs gold_output for each row
# - Promptfoo (future): Automated regression testing in CI pipeline
# - LLM judge: qwen-max evaluates faithfulness/density/thesis-capture dimensions

