  failure_mode_target: format_pollution

# === ADVERSARIAL CASES (3 rows) ===

- id: art_adv_001
  feature: tinyblog_summary
  input:
    article_id: null
    body: |
      TODO: 主旨在结论段的文章

      开头2-3段是背景铺垫，核心论点在最后1-2段
      测试AI是否只摘开头 (lead-only failure)
  gold_output: "TODO: 理想摘要 (必须包含结论段的核心论点)"
  notes: "Adversarial — 主旨后置，易触发lead-only错误"
  failure_mode_target: lead_only_summary

