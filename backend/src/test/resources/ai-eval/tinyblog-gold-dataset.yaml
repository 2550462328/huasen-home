# === EDGE CASES (3 rows) ===

- id: art_edge_001
  feature: tinyblog_summary
  input:
    article_id: null
    body: |
      TODO: 超长文章正文 (>10,000字)

      测试head+tail截断策略 (前4000字+后2000字)
      主旨应在引言或结论部分
  gold_output: "TODO: 理想摘要 (应反映核心论点，即使正文被截断)"
  notes: "Edge case — 验证超长文章截断后摘要质量"
  failure_mode_target: lead_only_summary

- id: art_edge_002
  feature: tinyblog_summary
  input:
    article_id: null
    body: |
      TODO: 极短文章正文 (<500字)

      测试AI在信息量有限时的表现
  gold_output: "TODO: 理想摘要 (可能接近原文长度)"
  notes: "Edge case — 短文章摘要不应编造内容"
  failure_mode_target: marketing_fluff

