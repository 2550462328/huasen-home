# HTTP 自动重定向到 HTTPS
server {
    listen 80;
    server_name www.huitogo.club huitogo.club;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name  www.huitogo.club huitogo.club;
    client_max_body_size 10m;

    ssl_certificate    /etc/nginx/cert/www.huitogo.club.pem;
    ssl_certificate_key  /etc/nginx/cert/www.huitogo.club.key;

    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_prefer_server_ciphers  on;

    # Portal 前端（根路径）
    location / {
        root /home/mainin/www/portal;
        try_files $uri $uri/ /index.html;
    }

    # Admin 后台管理
    location /admin {
        alias /home/mainin/www/admin;
        try_files $uri $uri/ /admin/index.html;
    }

    # API 反向代理到 Spring Boot
    location /api/ {
        # 跨域配置
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header Access-Control-Expose-Headers 'Content-Length,Content-Range' always;

        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
